<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thi Đấu - Liên Đoàn Taekwondo TP. Hà Nội</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 70px;
            --primary-color: #1e3c72;
            --primary-dark: #122549;
            --accent-color: #0d6efd;
            --success-color: #198754;
            --text-light: #ffffff;
            --text-dark: #333333;
            --bg-body: #f4f7f6;
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR LEFT --- */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, var(--primary-dark) 0%, var(--primary-color) 100%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: width var(--transition-speed) ease;
            z-index: 100;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
            flex-shrink: 0;
        }

        /* Khi sidebar thu nhỏ */
        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        /* Header của Sidebar */
        .sidebar-header {
            padding: 20px 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
            overflow: hidden;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border: 2px solid #fff;
            transition: all var(--transition-speed) ease;
        }

        .sidebar.collapsed .logo-img {
            width: 40px;
            height: 40px;
            margin-bottom: 0;
        }

        .brand-titles {
            transition: opacity var(--transition-speed) ease;
        }

        .sidebar.collapsed .brand-titles {
            display: none;
        }

        .sidebar-header h1 {
            font-size: 18px;
            color: #f1f5f9;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        .sidebar-header h2 {
            font-size: 18px;
            color: #f1f5f9;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Nút Thu nhỏ / Mở rộng Sidebar */
        .toggle-btn {
            position: absolute;
            top: 15px;
            right: -15px;
            width: 30px;
            height: 30px;
            background-color: var(--primary-color);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            z-index: 101;
            transition: transform var(--transition-speed) ease;
        }

        .toggle-btn:hover {
            background-color: var(--accent-color);
        }

        .sidebar.collapsed .toggle-btn i {
            transform: rotate(180deg);
        }

        /* Navigation Menu */
        .sidebar-menu {
            list-style: none;
            padding: 15px 10px;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .menu-item {
            margin-bottom: 8px;
        }

        .nav-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 16px;
            background: transparent;
            color: #cbd5e1;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .nav-btn i {
            font-size: 18px;
            min-width: 22px;
            text-align: center;
        }

        .nav-btn span {
            transition: opacity var(--transition-speed) ease;
        }

        .sidebar.collapsed .nav-btn span {
            display: none;
        }

        .sidebar.collapsed .nav-btn {
            justify-content: center;
            padding: 12px 0;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .nav-btn.register.active {
            background: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }

        .nav-btn.danhsach.active {
            background: var(--success-color);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.3);
        }

        /* --- MAIN CONTENT AREA --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .content-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
            background-image: linear-gradient(rgba(244, 247, 246, 0.92), rgba(244, 247, 246, 0.92)), url('logo.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 350px;
        }

        /* Responsive trên thiết bị di động */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
            }
            .sidebar.collapsed {
                left: calc(-1 * var(--sidebar-width));
            }
            .toggle-btn {
                right: -35px;
            }
            .sidebar.collapsed .toggle-btn i {
                transform: rotate(0deg);
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR LEFT -->
    <aside class="sidebar" id="sidebar">
        <!-- Nút thu nhỏ/mở rộng sidebar -->
        <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()" title="Thu nhỏ / Mở rộng">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div>
            <div class="sidebar-header">
                <img src="logo.jpg" alt="Logo Taekwondo" class="logo-img" onerror="this.style.display='none'">
                <div class="brand-titles">
                    <h1>LIÊN ĐOÀN TAEKWONDO</h1>
		    <h2>THÀNH PHỐ HÀ NỘI</h2>
                </div>
            </div>

            <ul class="sidebar-menu">
                <li class="menu-item">
                    <button type="button" onclick="loadPage('dangky.html', this)" class="nav-btn register active" title="Đăng Ký Thi Đấu">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>Đăng Ký Thi Đấu</span>
                    </button>
                </li>
                <li class="menu-item">
                    <button type="button" onclick="loadPage('danhsach.html', this)" class="nav-btn danhsach" title="Xem Danh Sách">
                        <i class="fa-solid fa-list-check"></i>
                        <span>Xem Danh Sách</span>
                    </button>
                </li>
            </ul>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">
        <iframe id="mainIframe" class="content-iframe" src="dangky.html"></iframe>
    </main>

    <script>
        // Mặc định load trang dangky.html
        window.addEventListener('DOMContentLoaded', () => {
            const defaultBtn = document.querySelector('.nav-btn.register');
            if (defaultBtn) {
                defaultBtn.classList.add('active');
            }
        });

        // Hàm chuyển đổi nội dung hiển thị trong Iframe bên phải
        function loadPage(url, btnElement) {
            const iframe = document.getElementById('mainIframe');
            iframe.src = url;

            // Cập nhật trạng thái Active cho nút bấm
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) {
                btnElement.classList.add('active');
            }
        }

        // Hàm thu nhỏ / mở rộng Sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }
    </script>
</body>
</html>
